<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario de Registro</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e8f8e8,
                #fff8dc,
                #fce4ec
            );

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            position: relative;
            overflow: hidden;
        }

        .flower {
            position: absolute;
            font-size: 45px;
            opacity: 0.8;
        }

        .flower-1 {
            top: 10px;
            left: 15px;
        }

        .flower-2 {
            top: 15px;
            right: 20px;
        }

        .flower-3 {
            bottom: 10px;
            left: 20px;
        }

        .flower-4 {
            bottom: 10px;
            right: 20px;
        }

        .title {
            text-align: center;
            color: #5a8f5a;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-label {
            color: #4f6f52;
            font-weight: 600;
        }

        .form-control {
            border-radius: 12px;
            border: 1px solid #c9dfc9;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #8bc48b;
            box-shadow: 0 0 0 0.2rem rgba(139, 196, 139, 0.25);
        }

        .btn-spring {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 12px;
            background: #79b879;
            color: white;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-spring:hover {
            background: #5f9f5f;
            transform: translateY(-2px);
        }

        @media (max-width: 576px) {
            .form-card {
                padding: 25px 20px;
            }

            .flower {
                font-size: 32px;
            }

            .title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="form-card">

            <!-- Flores decorativas -->
            <div class="flower flower-1">🌸</div>
            <div class="flower flower-2">🌼</div>
            <div class="flower flower-3">🌷</div>
            <div class="flower flower-4">🌻</div>

            <h1 class="title">Registro</h1>

            <p class="subtitle">
                ¡Completá tus datos!
            </p>

            <form action="https://hook.us2.make.com/efy1a88b2y2oun6bu94cujfsdx4qyhgo">

                <!-- Nombre -->
                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresá tu nombre"
                        required
                    >
                </div>

                <!-- Apellido -->
                <div class="mb-3">
                    <label for="apellido" class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="apellido"
                        name="apellido"
                        placeholder="Ingresá tu apellido"
                        required
                    >
                </div>

                <!-- Edad -->
                <div class="mb-4">
                    <label for="edad" class="form-label">
                        Edad
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="edad"
                        name="edad"
                        placeholder="Ingresá tu edad"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <!-- Botón -->
                <button
                    type="submit"
                    class="btn btn-spring"
                >
                    🌱 Enviar datos
                </button>

            </form>

        </div>

    </div>

</body>
</html>
